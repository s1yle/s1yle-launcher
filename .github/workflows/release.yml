name: Release

# 触发方式：
# - 推送 tag（如 v0.1.0-alpha.5 / v0.1.0）→ 自动构建并上传 draft Release
# - workflow_dispatch → 手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb appimage
          - os: windows-latest
            bundles: msi nsis
          - os: macos-latest
            bundles: app dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Pre-build checks
        run: |
          pnpm check:contracts
          pnpm test
          npx tsc --noEmit

      - name: Rust unit tests (skip network-dependent modules)
        working-directory: src-tauri
        run: cargo test --lib -- --skip microsoft_login

      - name: Generate application icons
        run: pnpm logo:gen

      - name: Build & bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'WeCraft! Launcher ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download this version.'
          releaseDraft: true
          prerelease: true
          args: --bundles ${{ matrix.bundles }}
